<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1a24">
<title>VITALX · Health Monitoring Software for Astronauts</title>
<meta name="description" content="VITALX by NovaCare, NASA Space Apps 2026 challenge: Create Health Monitoring Software for Astronauts on Space Missions. Personal baselines catch slow drift early, with real NASA cabin CO2 data.">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- أداء: الصورة الأكبر (الرائد) والخطوط تُطلب مبكراً؛ الخطوط مستضافة محلياً بدل Google Fonts -->
<link rel="preload" href="media/astronaut.webp" imagesrcset="media/astronaut-440.webp 1x, media/astronaut.webp 2x" as="image" type="image/webp" fetchpriority="high">
<link rel="preload" href="webfonts/ibm-plex-sans-arabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="webfonts/ibm-plex-sans-arabic-700-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="appmode.css">
<link rel="stylesheet" href="console.css">
<link rel="stylesheet" href="six.css">
<!-- أداء: إخفاء الهيكل الفارغ حتى يرسمه site.js (كان ظهوره ثم امتلاؤه يسبب إزاحة كبيرة CLS). احتياط: يظهر بعد 3 ثوانٍ مهما حدث -->
<style>html:not(.vx-ready) .stage { visibility: hidden; }</style>
<script>setTimeout(function () { document.documentElement.classList.add("vx-ready"); }, 3000);</script>
<script>/* خط ثمانية من مجلد fonts/ على جهازك فقط (غير مرفوع بسبب الترخيص) */
if (location.protocol === "file:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = "fonts-local.css"; document.head.appendChild(l); }</script>
</head>
<body class="appmode console has-ship has-astro">
<!-- 6 شاشات فقط. النصوص من content.js (site)، والحساب من engine.js -->
<div class="room" aria-hidden="true"><i class="ceil"></i><i class="ring r1"></i><i class="ring r2"></i><i class="floor"></i></div>

<div class="stage">
  <!-- شريط القياسات العلوي -->
  <header class="telemetry glassbar" id="telemetry"></header>

  <div class="carousel">
  <aside class="ghost gl" id="ghostL" aria-hidden="true"></aside>
  <section class="holo">
    <div class="holo-head">
      <a class="brand" href="index.html">VITAL<span>X</span></a>
      <div class="holo-title">
        <h1><span id="screenTitle"></span></h1>
        <p id="subtitle"></p>
      </div>
      <span class="phase" id="phase"></span>
    </div>
    <div class="holo-body">
      <div class="viewport">
        <main class="view" id="view" tabindex="-1"></main>
        <button class="edge prev" id="edgePrev" type="button" aria-label="prev"></button>
        <button class="edge next" id="edgeNext" type="button" aria-label="next"></button>
      </div>
      <nav class="rail" id="tabs" aria-label="VITALX"></nav>
    </div>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </section>
  <aside class="ghost gr" id="ghostR" aria-hidden="true"></aside>
  </div>

  <div class="timeline" id="timeline">
    <div class="tl-track" id="tlTrack">
      <div class="tl-adapt" id="tlAdapt"></div>
      <div class="tl-calib" id="tlCalib"></div>
      <div class="tl-done" id="tlDone"></div>
      <div class="tl-ticks" id="tlTicks"></div>
    </div>
    <input type="range" id="scrub" min="0" max="119" value="0" aria-label="Mission day">
  </div>

  <!-- لوحة الأزرار السفلية -->
  <footer class="deck">
    <div class="keys">
      <button class="key" id="restartBtn" type="button"></button>
      <button class="key primary" id="playBtn" type="button"></button>
      <button class="key" id="stepBtn" type="button"></button>
      <label class="key speed"><span id="speedLab"></span><select id="speedSel"></select></label>
      <button class="key" id="nextBtn" type="button"></button>
      <div class="key daybadge"><span id="dayLab"></span> <b id="dayNum" dir="ltr">0</b><small dir="ltr" id="dayOf"></small></div>
      <button class="key tilt" id="tiltBtn" type="button" hidden></button>
      <button class="key" id="langBtn" type="button"></button>
    </div>
    <p class="fine"><span class="tag-synth" id="synthTag"></span> <span id="disclaimer"></span></p>
  </footer>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="content.js"></script>
<script src="engine.js"></script>
<script src="data/rr12-daily.js"></script>
<script src="data/eda-missions.js"></script>
<script src="site.js"></script>
</body>
</html>
