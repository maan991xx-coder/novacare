<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#070b16">
<meta name="mobile-web-app-capable" content="yes">
<title>VITALX</title>
<style>
:root{--bg:#070b16;--panel:#111a31;--line:#24314f;--text:#e7ecf7;--muted:#95a3c0;--accent:#5fd4ff;--accent2:#8b7bff;--ok:#3ddc97;--info:#6aa8ff;--warn:#ffb547;--danger:#ff5d6c;--u:1vmin}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100vmin;height:100vmin;font-size:calc(var(--u)*4.6);
 background:radial-gradient(70% 50% at 85% 0%,rgba(95,212,255,.16),transparent 70%),radial-gradient(70% 50% at 0% 100%,rgba(139,123,255,.14),transparent 70%),var(--bg)}
body.round #app{border-radius:50%}
.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;direction:ltr;unicode-bidi:isolate}
.brand{direction:ltr;font-weight:700;letter-spacing:.08em}.brand span{color:var(--accent)}
.v{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10%}
.v.on{display:flex;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
#ring{position:absolute;inset:2%;width:96%;height:96%}
#ring circle{fill:none;stroke-width:3.2}
#ringFg{stroke-linecap:round;transition:stroke-dashoffset .8s ease,stroke .5s}
.hdr{font-size:calc(var(--u)*4.4);color:var(--muted)}
.heart{color:var(--danger);font-size:calc(var(--u)*6);animation:beat var(--beat,1s) infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}}
.big{font-size:calc(var(--u)*21);font-weight:600;line-height:1}
.sub{color:var(--muted);font-size:calc(var(--u)*4)}
.pill{display:inline-block;margin-top:calc(var(--u)*2);padding:0 calc(var(--u)*3.5);border-radius:999px;font-weight:600;font-size:calc(var(--u)*4.4);border:2px solid currentColor;line-height:1.7}
.stats{display:flex;gap:calc(var(--u)*5);margin-top:calc(var(--u)*3)}
.stats div{display:flex;flex-direction:column;align-items:center}
.stats b{font-family:"IBM Plex Mono",monospace;font-size:calc(var(--u)*5.4);direction:ltr}
.stats span{font-size:calc(var(--u)*3.3);color:var(--muted)}
h2{font-size:calc(var(--u)*6.6);margin-bottom:calc(var(--u)*2)}
.row{display:flex;align-items:center;gap:calc(var(--u)*2);margin:calc(var(--u)*1.6) 0;width:72vmin;font-size:calc(var(--u)*4.4)}
.row span{width:24vmin;text-align:start;white-space:nowrap;overflow:hidden}
.tr{flex:1;height:calc(var(--u)*3);background:var(--panel);border-radius:9px;overflow:hidden;direction:ltr}
.fl{height:100%;border-radius:9px;transition:width .6s}
.row b{width:12vmin;text-align:end;font-family:"IBM Plex Mono",monospace}
.msg{color:var(--muted);font-size:calc(var(--u)*3.8);margin-top:calc(var(--u)*2);line-height:1.5;max-width:70vmin}
canvas{width:76vmin;height:36vmin}
.dots{position:absolute;bottom:10%;left:0;right:0;display:flex;gap:6px;justify-content:center}
.dots i{width:calc(var(--u)*1.6);height:calc(var(--u)*1.6);border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}
#splash .logo{font-size:calc(var(--u)*13);font-weight:700;letter-spacing:.1em;direction:ltr}
#splash .bar{width:40vmin;height:calc(var(--u)*1.3);border-radius:4px;background:var(--panel);margin-top:calc(var(--u)*6);overflow:hidden;direction:ltr}
#splash .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:load 1.8s ease forwards}
@keyframes load{to{width:100%}}
</style></head>
<body>
<div id="app">
  <svg id="ring" viewBox="0 0 100 100" style="display:none"><circle cx="50" cy="50" r="47" stroke="#16213d"/><circle id="ringFg" cx="50" cy="50" r="47" stroke="#3ddc97" stroke-dasharray="295.3" stroke-dashoffset="295.3" transform="rotate(-90 50 50)"/></svg>

  <div class="v on" id="splash">
    <svg width="20%" viewBox="0 0 40 40" fill="none" stroke="#5fd4ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="17" stroke="#24314f"/><path d="M7 21h7l3-7 4 13 3-8 2 2h7"/></svg>
    <div class="logo">VITAL<span style="color:var(--accent)">X</span></div>
    <div class="sub" id="tagline"></div>
    <div class="bar"><i></i></div>
  </div>

  <div class="v" id="vit">
    <div class="hdr"><span class="brand">VITAL<span>X</span></span> · <span class="mono" id="day"></span></div>
    <div class="heart" id="heart">♥</div>
    <div class="big mono" id="hr">--</div>
    <div class="sub" id="hrLab"></div>
    <div><span class="pill" id="pill"></span></div>
    <div class="stats"><div><b id="sl">--</b><span id="slLab"></span></div><div><b id="co">--</b><span>CO2</span></div><div><b id="ds">--</b><span>mSv</span></div></div>
  </div>

  <div class="v" id="exp"></div>

  <div class="v" id="trd">
    <h2 id="trdH"></h2>
    <canvas id="cv"></canvas>
    <div class="msg" id="trdTxt" style="color:var(--text)"></div>
  </div>

  <div class="dots" id="dots" style="display:none"><i></i><i></i><i></i></div>
</div>

      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gauss(r) {
    let u = 0, v = 0;
    while (u === 0) u = r();
    while (v === 0) v = r();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function median(a) {
    const s = a.slice().sort((x, y) => x - y), n = s.length;
    if (!n) return NaN;
    return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
  }
  function mean(a) { return a.length ? a.reduce((s, v) => s + v, 0) / a.length : NaN; }

  // ---------- robust_z (مطابق للنسخة المصححة) ----------
  function baselineStats(base, minScale) {
    const med = median(base);
    const mad = median(base.map(v => Math.abs(v - med))) * 1.4826;
    let ms;
    if (minScale && minScale.type === "absolute") ms = minScale.value;   // مثل النوم بالساعات
    else ms = med !== 0 ? (minScale ? minScale.value : 0.05) * Math.abs(med) : 1e-3;
    return { med, mad, scale: Math.max(mad, ms) };
  }
  function robustZ(x, st) { return (x - st.med) / st.scale; }

  // ---------- CUSUM ثنائي الاتجاه مع إعادة التصفير ----------
  function makeCusum(k, h) {
    let sp = 0, sn = 0;
    return function step(v) {
      sp = Math.max(0, sp + v - k);
      sn = Math.max(0, sn - v - k);
      const up = sp > h, dn = sn > h;
      const rec = { fired: up || dn, side: up ? 1 : dn ? -1 : 0, sp, sn };
      if (rec.fired) { sp = 0; sn = 0; }
      return rec;
    };
  }
  function cusumTwoSided(z, k, h) { const s = makeCusum(k, h); return z.map(v => s(v).fired); }

  // ---------- مولّد البيانات الصناعية بمرحلة تكيف ----------
  function generateAstronaut(sim, rng, opt) {
    opt = opt || {};
    const driftMult = opt.driftMult == null ? 1 : opt.driftMult;
    const noiseMult = opt.noiseMult == null ? 1 : opt.noiseMult;
    const D = sim.missionDays, P = sim.preflightDays;
    const onset = opt.onset != null ? opt.onset
      : Math.round(sim.onsetRange[0] + rng() * (sim.onsetRange[1] - sim.onsetRange[0]));
    const tau = sim.adaptation.tau;
    const out = { onset, truth: {}, obs: {}, pre: {}, personal: {}, rad: [] };
    for (const id in sim.channels) {
      const c = sim.channels[id];
      const personal = c.popMean + c.popSd * gauss(rng);
      const preOffset = c.preflightOffsetSd * gauss(rng);  // الأرض ليست الفضاء تماماً
      out.personal[id] = personal;
      out.pre[id] = Array.from({ length: P }, () => personal + preOffset + c.noiseSd * noiseMult * gauss(rng));
      const truth = [], obs = [];
      for (let t = 0; t < D; t++) {
        const adapt = c.adaptAmp * Math.exp(-t / tau);
        const drift = t >= onset ? c.drift * driftMult * (t - onset) : 0;
        const v = personal + adapt + drift;
        truth.push(v);
        obs.push(v + c.noiseSd * noiseMult * gauss(rng));
      }
      out.truth[id] = truth; out.obs[id] = obs;
    }
    let cum = 0;
    for (let t = 0; t < D; t++) { cum += Math.max(0, sim.radiation.dailyMean + sim.radiation.dailySd * gauss(rng)); out.rad.push(cum); }
    return out;
  }

  // ---------- الطريقة الشخصية ----------
  function activeChannels(sim) {
    return Object.keys(sim.channels).filter(id => id !== "chem" || sim.personal.includeChem);
  }
  function runPersonal(ast, sim) {
    const p = sim.personal, D = sim.missionDays, ign = sim.adaptation.days;
    const ids = activeChannels(sim);
    let initStart, active;
    if (p.baselineMode === "naive") { initStart = 0; active = p.stableWindow; }
    else if (p.baselineMode === "preflight") { initStart = null; active = ign; }
    else { initStart = ign; active = ign + p.stableWindow; }

    const st = {}, anchor = {}, win = {}, z = {}, chCus = {}, band = {};
    ids.forEach(id => {
      const c = sim.channels[id];
      const base = initStart == null ? ast.pre[id] : ast.obs[id].slice(initStart, initStart + p.stableWindow);
      st[id] = baselineStats(base, c.minScale);
      anchor[id] = Object.assign({}, st[id]);
      win[id] = base.slice();
      z[id] = new Array(D).fill(null);
      band[id] = new Array(D).fill(null);
      chCus[id] = makeCusum(p.k, p.h);
    });
    const comp = makeCusum(p.k, p.h);
    const wsum = Math.sqrt(ids.reduce((s, id) => s + sim.channels[id].weight ** 2, 0)) || 1;
    const level = new Array(D).fill(0), composite = new Array(D).fill(null), compS = new Array(D).fill(null);
    const explain = new Array(D).fill(null);

    for (let t = 0; t < D; t++) {
      ids.forEach(id => { band[id][t] = { med: st[id].med, scale: st[id].scale }; });
      if (t < active) continue;
      let zc = 0, chFired = 0, bigCount = 0;
      const contrib = [];
      ids.forEach(id => {
        const c = sim.channels[id];
        const zi = robustZ(ast.obs[id][t], st[id]);
        z[id][t] = zi;
        if (chCus[id](zi).fired) chFired++;
        const bad = c.direction * zi;          // موجب = في الاتجاه السيئ
        if (bad > p.urgentZ) bigCount++;
        zc += c.weight * bad;
        contrib.push({ id, z: zi, bad, w: c.weight });
      });
      zc /= wsum;
      composite[t] = zc;
      const cr = comp(zc);
      compS[t] = cr.sp;
      let lv = chFired > 0 ? 1 : 0;
      if (cr.fired && cr.side === 1) lv = bigCount >= 2 ? 3 : 2;
      level[t] = lv;
      if (lv > 0) explain[t] = contrib;

      // تحديث خط الأساس المتحرك مع الحماية
      if (p.baselineMode === "rolling") {
        ids.forEach(id => {
          const zi = z[id][t];
          if (Math.abs(zi) <= p.guardZ) {
            win[id].push(ast.obs[id][t]);
            if (win[id].length > p.rollingWindow) win[id].shift();
          }
          const ns = baselineStats(win[id], sim.channels[id].minScale);
          if (p.useAnchor) {
            const lim = p.anchorMaxShiftZ * anchor[id].scale;
            ns.med = Math.min(anchor[id].med + lim, Math.max(anchor[id].med - lim, ns.med));
          }
          st[id] = ns;
        });
      }
    }
    return { level, z, composite, compS, band, explain, active };
  }

  // ---------- الطريقة الثابتة العامة ----------
  function runFixed(ast, sim) {
    const f = sim.fixed, D = sim.missionDays;
    const active = f.ignoreAdaptation ? sim.adaptation.days : 0;
    const ids = Object.keys(f.thresholds);
    const run = {}; ids.forEach(id => run[id] = 0);
    const level = new Array(D).fill(0);
    for (let t = active; t < D; t++) {
      let n = 0;
      ids.forEach(id => {
        const th = f.thresholds[id], v = ast.obs[id][t];
        const over = th.op === ">" ? v > th.value : v < th.value;
        run[id] = over ? run[id] + 1 : 0;
        if (run[id] >= f.persistenceDays) n++;
      });
      level[t] = n >= 2 ? 3 : n === 1 ? 2 : 0;
    }
    return { level, active };
  }

  // ---------- المقاييس ----------
  function scoreRun(level, onset, active, sim) {
    // الكشف = أول نوبة تنبيه تبدأ في يوم البدء أو بعده. إنذار مستمر من قبل البدء لا يُحسب كشفاً
    let det = null;
    for (let t = Math.max(onset, active); t < level.length; t++) {
      if (level[t] >= 2 && (t === active || level[t - 1] < 2 || t === onset && level[t - 1] < 2)) { det = t; break; }
    }
    let fa = 0, prev = 0;
    for (let t = active; t < onset; t++) { const on = level[t] >= 2 ? 1 : 0; if (on && !prev) fa++; prev = on; }
    const delay = det == null ? null : det - onset;
    return { detected: delay != null && delay <= sim.detectWindow, delay, falseAlarms: fa, preDays: Math.max(0, onset - active) };
  }

  // ---------- إسقاط الاتجاه ----------
  function linfit(ys, xs) {
    const mx = mean(xs), my = mean(ys);
    let num = 0, den = 0;
    xs.forEach((x, i) => { num += (x - mx) * (ys[i] - my); den += (x - mx) ** 2; });
    const b = den ? num / den : 0;
    return { slope: b, at: x => my + b * (x - mx) };
  }
  function projectCrossing(series, t, w, thr, dir) {
    if (t - w + 1 < 0) return null;
    const xs = [], ys = [];
    for (let i = t - w + 1; i <= t; i++) { xs.push(i); ys.push(series[i]); }
    const f = linfit(ys, xs);
    const s = f.slope * dir, gap = (thr - f.at(t)) * dir;
    if (gap <= 0) return { day: t, slope: f.slope, fit: f };
    if (s <= 0) return null;
    return { day: t + gap / s, slope: f.slope, fit: f };
  }
  function projectionFor(ast, sim, pers) {
    const c = sim.channels.hr, pr = sim.projection;
    const at = pers.active;
    const b = pers.band.hr[at] || pers.band.hr[pers.band.hr.length - 1];
    const thr = b.med + c.direction * pr.monitorZ * b.scale;
    let trueCross = null;
    for (let t = at; t < sim.missionDays; t++) if ((ast.truth.hr[t] - thr) * c.direction >= 0) { trueCross = t; break; }
    let detDay = null;
    for (let t = ast.onset; t < sim.missionDays; t++) if (pers.level[t] >= 2) { detDay = t; break; }
    // نقيم الإسقاط عند لحظة أول تنبيه، ثم بعدها بأيام (offsets)، قبل العبور الحقيقي فقط
    const evals = (pr.evalOffsets || [0]).map(off => {
      const d = detDay != null ? detDay + off : null;
      if (d == null || d >= sim.missionDays || (trueCross != null && d >= trueCross)) return { off, day: d, proj: null, error: null };
      const proj = projectCrossing(ast.obs.hr, d, pr.window, thr, c.direction);
      return { off, day: d, proj, error: proj && trueCross != null ? proj.day - trueCross : null };
    });
    return { thr, trueCross, detDay, evals };
  }

  // ---------- مونت كارلو ----------
  function cohort(sim, opt) {
    opt = opt || {};
    const rng = mulberry32(opt.seed != null ? opt.seed : sim.seed);
    const n = opt.n || sim.cohortSize;
    const acc = { personal: [], fixed: [], projErr: [] };
    for (let i = 0; i < n; i++) {
      const a = generateAstronaut(sim, rng, opt);
      const pr = runPersonal(a, sim), fx = runFixed(a, sim);
      acc.personal.push(scoreRun(pr.level, a.onset, pr.active, sim));
      acc.fixed.push(scoreRun(fx.level, a.onset, fx.active, sim));
      if (!opt.skipProjection) projectionFor(a, sim, pr).evals.forEach((e, j) => {
        (acc.projErr[j] = acc.projErr[j] || { off: e.off, errs: [] });
        if (e.error != null) acc.projErr[j].errs.push(e.error);
      });
    }
    return { personal: summarize(acc.personal), fixed: summarize(acc.fixed), projection: acc.projErr.map(p => Object.assign({ off: p.off }, summarizeProj(p.errs))), n };
  }
  function summarize(rs) {
    const det = rs.filter(r => r.detected), delays = det.map(r => r.delay);
    const fa = rs.reduce((s, r) => s + r.falseAlarms, 0), days = rs.reduce((s, r) => s + r.preDays, 0);
    return {
      rate: det.length / rs.length,
      medianDelay: delays.length ? median(delays) : null,
      meanDelay: delays.length ? mean(delays) : null,
      faPer100: days ? (fa / days) * 100 : 0,
      faRuns: rs.filter(r => r.falseAlarms > 0).length / rs.length
    };
  }
  function summarizeProj(errs) {
    if (!errs.length) return { n: 0 };
    const abs = errs.map(Math.abs);
    return { n: errs.length, medAbs: median(abs), bias: median(errs), within5: abs.filter(e => e <= 5).length / abs.length };
  }

  const api = { mulberry32, gauss, median, baselineStats, robustZ, makeCusum, cusumTwoSided,
    generateAstronaut, runPersonal, runFixed, scoreRun, projectCrossing, projectionFor, cohort, activeChannels };
  root.VITALX_ENGINE = api;
  if (typeof module !== "undefined") module.exports = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
(function(){
"use strict";
const C=window.VITALX_CONTENT,E=window.VITALX_ENGINE,D=C.devicesPage,W=D.watch;
const $=id=>document.getElementById(id);
const q=new URLSearchParams(location.search);
let lang=q.get("lang")==="en"?"en":"ar";
if(q.get("round")==="1")document.body.classList.add("round");
document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
const t=x=>(x&&typeof x==="object")?(x[lang]!=null?x[lang]:x.ar):(x==null?"":String(x));
const clean=s=>String(s).replace(/⟨[^⟩]*⟩\s*/g,"");
const f=(v,d=1)=>v==null||isNaN(v)?"--":Number(v).toFixed(d);

const sim=JSON.parse(JSON.stringify(C.sim));
const ast=E.generateAstronaut(sim,E.mulberry32(sim.seed*1000+7919),{});
const pers=E.runPersonal(ast,sim);
const proj=E.projectionFor(ast,sim,pers);
const N=sim.missionDays;
const col=["#3ddc97","#6aa8ff","#ffb547","#ff5d6c"];

$("tagline").textContent=lang==="ar"?"مراقبة صحة الرائد · خط أساس شخصي":"Astronaut health · personal baseline";
$("hrLab").textContent=t(sim.channels.hr.name)+" · bpm";
$("slLab").textContent=lang==="ar"?"النوم":"Sleep";
$("trdH").textContent=t(W.screens.trend);

const views=["vit","exp","trd"];let view=0,day=0,lastAlert=null,paused=false;
function show(i){view=i;["splash",...views].forEach(id=>$(id).classList.remove("on"));$(views[i]).classList.add("on");
 $("ring").style.display=i===0?"":"none";
 [...$("dots").children].forEach((d,k)=>d.classList.toggle("on",k===i));}

function update(){
 const d=day,cal=d<pers.active,lv=pers.level[d]||0;
 if(lv>=1)lastAlert=d;
 $("day").textContent="D"+d;
 const hr=ast.obs.hr[d];$("hr").textContent=f(hr,0);
 document.documentElement.style.setProperty("--beat",(60/Math.max(40,hr)).toFixed(2)+"s");
 $("sl").textContent=f(ast.obs.sleep[d],1)+"h";$("co").textContent=f(ast.obs.co2[d],1);$("ds").textContent=f(ast.rad[d],0);
 const s=pers.compS[d],frac=cal?d/pers.active:Math.min(1,(s||0)/sim.personal.h);
 const c=cal?"#a5afc4":col[lv?lv:frac>.6?2:0];
 const fg=$("ringFg");fg.style.strokeDashoffset=295.3*(1-Math.max(.02,frac));fg.style.stroke=c;
 const p=$("pill");p.style.color=c;p.textContent=cal?t(W.calibrating):lv?t(C.alerts[lv].name):t(W.ok);
 renderExp();renderTrend();
}
function renderExp(){
 const ad=lastAlert,el=$("exp");
 if(ad==null||ad<pers.active||!pers.explain[ad]){el.innerHTML=`<h2>${t(W.screens.explain)}</h2><div class="msg">${t(W.noAlert)}</div>`;return;}
 const c=pers.explain[ad],lv=pers.level[ad],tot=c.reduce((s,x)=>s+Math.max(0,x.w*x.bad),0)||1;
 const bc={hr:"#ff5d6c",co2:"#ffb547",sleep:"#5fd4ff"};
 el.innerHTML=`<h2 style="color:${col[lv]}">${t(W.screens.explain)}</h2><div class="sub">${t(C.alerts[lv].name)} · <span class="mono">D${ad}</span></div>`+
  c.map(x=>{const sh=Math.max(0,x.w*x.bad)/tot;return `<div class="row"><span>${t(sim.channels[x.id].name)}</span><div class="tr"><div class="fl" style="width:${(sh*100).toFixed(0)}%;background:${bc[x.id]||"#8b7bff"}"></div></div><b>${Math.round(sh*100)}%</b></div>`}).join("")+
  `<div class="msg">${clean(t(C.alerts[lv].text))}</div>`;
}
function renderTrend(){
 const cv=$("cv"),dpr=window.devicePixelRatio||1,w=cv.clientWidth||300,h=cv.clientHeight||140;
 cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
 const d=day,from=Math.max(0,d-29),hz=14,xs=[];for(let i=from;i<=d;i++)xs.push(i);
 const vals=xs.map(i=>ast.obs.hr[i]).concat([proj.thr]);const lo=Math.min(...vals)-2,hi=Math.max(...vals)+2;
 const X=i=>((i-from)/(29+hz))*(w-6)+3,Y=v=>h-4-((v-lo)/(hi-lo))*(h-8);
 g.strokeStyle="#ffb547";g.lineWidth=1.5;g.setLineDash([5,5]);g.beginPath();g.moveTo(0,Y(proj.thr));g.lineTo(w,Y(proj.thr));g.stroke();g.setLineDash([]);
 g.strokeStyle="#5fd4ff";g.lineWidth=2.5;g.beginPath();xs.forEach((i,k)=>k?g.lineTo(X(i),Y(ast.obs.hr[i])):g.moveTo(X(i),Y(ast.obs.hr[i])));g.stroke();
 g.fillStyle="#5fd4ff";g.beginPath();g.arc(X(d),Y(ast.obs.hr[d]),4,0,7);g.fill();
 let txt=t(W.flat);
 if(d>=pers.active){const p=E.projectCrossing(ast.obs.hr,d,sim.projection.window,proj.thr,1);
  if(p&&p.fit){g.strokeStyle="#8b7bff";g.lineWidth=2;g.setLineDash([5,4]);g.beginPath();
   g.moveTo(X(d-sim.projection.window+1),Y(p.fit.at(d-sim.projection.window+1)));g.lineTo(X(d+hz),Y(p.fit.at(d+hz)));g.stroke();g.setLineDash([]);
   const left=p.day-d;if(left<=0)txt="!";else if(left<60)txt=`${t(W.projection)} <b class="mono" style="color:#ffb547">${Math.round(left)}</b> ${t(W.days)}`;}}
 else txt=t(W.calibrating);
 $("trdTxt").innerHTML=txt;
}

// اللمس: نقرة = الشاشة التالية، ضغطة طويلة = إيقاف/تشغيل
let pressT=0,vt=0;
$("app").addEventListener("pointerdown",()=>{pressT=Date.now();});
$("app").addEventListener("pointerup",()=>{if(Date.now()-pressT>600){paused=!paused;return;}vt=0;show((view+1)%3);});

setTimeout(()=>{$("dots").style.display="";show(0);update();
 setInterval(()=>{if(paused)return;day=(day+1)%N;if(day===0)lastAlert=null;update();},1600);
 setInterval(()=>{if(paused)return;vt+=1;if(vt>=6){vt=0;show((view+1)%3);}},1000);
},2000);
})();
</script>
